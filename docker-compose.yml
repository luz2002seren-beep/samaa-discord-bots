services:
  nodelink:
    image: performanc/nodelink:latest
    container_name: samaa-nodelink
    restart: unless-stopped
    environment:
      NODELINK_SERVER_HOST: 0.0.0.0
      NODELINK_SERVER_PORT: 2333
      NODELINK_SERVER_PASSWORD: ${NODELINK_PASSWORD:?Set NODELINK_PASSWORD in .env}
      NODELINK_CLUSTER_ENABLED: "true"
      NODELINK_CLUSTER_WORKERS: "0"
      NODELINK_SOURCES_YOUTUBE_ENABLED: "true"
      NODELINK_SOURCES_SPOTIFY_ENABLED: "true"
      NODELINK_SOURCES_SPOTIFY_CLIENTID: ${SPOTIFY_CLIENT_ID:?Set SPOTIFY_CLIENT_ID in .env}
      NODELINK_SOURCES_SPOTIFY_CLIENTSECRET: ${SPOTIFY_CLIENT_SECRET:?Set SPOTIFY_CLIENT_SECRET in .env}
    ports:
      - "2333:2333"
